name: Daily market analysis
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
      ANGELONE_CLIENT_CODE: ${{ secrets.ANGELONE_CLIENT_CODE }}
      ANGELONE_PIN: ${{ secrets.ANGELONE_PIN }}
      ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
      ANGELONE_SYMBOL: ${{ vars.ANGELONE_SYMBOL || 'SBIN-EQ' }}
      ANGELONE_SYMBOL_TOKEN: ${{ vars.ANGELONE_SYMBOL_TOKEN || '3045' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python worker.py --once
      - uses: actions/upload-artifact@v4
        with:
          name: daily-market-report
          path: data/latest_report.json
          retention-days: 30
