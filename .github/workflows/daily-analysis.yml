name: Daily NIFTY and SENSEX status
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ANGELONE_REPORT_URL: ${{ vars.ANGELONE_REPORT_URL }}
      DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve deployed report or explain deployment blocker
        run: python workflow_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-nifty-sensex-report
          path: data/reports/
          retention-days: 30
